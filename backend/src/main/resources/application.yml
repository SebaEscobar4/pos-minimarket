spring:
  application:
    name: pos-minimarket
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pos_minimarket}
    username: ${DB_USERNAME:pos_user}
    password: ${DB_PASSWORD:pos_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mvc:
    problemdetails:
      enabled: true
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  session:
    jdbc:
      initialize-schema: never

server:
  servlet:
    session:
      cookie:
        name: POS_SESSION
        http-only: true
        same-site: lax
        secure: ${POS_COOKIE_SECURE:false}

  # OQ-01 mantiene pendiente el timeout de inactividad y la duración máxima.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  info:
    env:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level correlationId=%X{correlationId:-none} logger=%logger{36} - %msg%n"
  level:
    root: INFO

info:
  app:
    name: POS Minimarket
    version: "@project.version@"

pos:
  security:
    allowed-origins: ${POS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
  identity:
    bootstrap:
      username: ${POS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${POS_BOOTSTRAP_ADMIN_PASSWORD:}
      display-name: ${POS_BOOTSTRAP_ADMIN_DISPLAY_NAME:Administrador inicial}
    password:
      minimum-length: 12
      maximum-length: 128
    authentication:
      maximum-failures: 5
      failure-window: PT15M
